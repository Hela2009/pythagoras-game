<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pythagoras — The Triangle Quest</title>

<style>
:root {
    --bg: #0B1020;
    --panel: #151D35;
    --panel2: #202B4A;
    --white: #FFFFFF;
    --text: #F5F7FF;
    --muted: #AAB6D6;
    --cyan: #39D9FF;
    --purple: #8E6CFF;
    --gold: #FFD166;
    --green: #35E08A;
    --red: #FF5C73;
    --orange: #FF9F43;
    --button: #101828;
    --button-hover: #24345E;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

#game {
    min-height: 100vh;
    padding: 25px;
}

h1, h2, h3, p {
    margin-top: 0;
}

button {
    font-family: Arial, sans-serif;
    cursor: pointer;
}

/* =========================
   HEADER
========================= */

.header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.header h2 {
    margin: 0;
    font-size: 25px;
}

.header span {
    color: var(--muted);
    font-size: 12px;
}

/* =========================
   START SCREEN
========================= */

.start-screen {
    text-align: center;
    max-width: 1000px;
    margin: auto;
}

.logo {
    font-size: 42px;
    font-weight: 800;
    color: var(--gold);
    margin-top: 20px;
}

.subtitle {
    color: var(--cyan);
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 1px;
}

.tagline {
    color: var(--muted);
    margin-bottom: 20px;
}

/* =========================
   AVATARS
========================= */

.avatars {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
}

.avatar-card {
    background: var(--panel);
    padding: 10px;
    border-radius: 10px;
    min-width: 80px;
}

.avatar {
    width: 55px;
    height: 55px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
    margin: auto;
}

.avatar-name {
    font-size: 11px;
    font-weight: bold;
    margin-top: 5px;
}

/* =========================
   PANELS
========================= */

.panel {
    background: var(--panel);
    padding: 30px;
    border-radius: 14px;
    max-width: 750px;
    margin: 20px auto;
}

.panel h2 {
    color: var(--green);
}

/* =========================
   BUTTONS
========================= */

.game-button {
    border: 1px solid #52638E;
    background: var(--button);
    color: var(--red);
    border-radius: 8px;
    padding: 13px 25px;
    min-width: 230px;
    font-size: 15px;
    font-weight: bold;
    margin: 7px;
    transition: 0.15s;
}

.game-button:hover {
    background: var(--button-hover);
    transform: translateY(-2px);
}

.green {
    background: var(--green);
    color: #07120D;
}

.green:hover {
    background: #50eca0;
}

.purple {
    background: var(--purple);
    color: white;
}

.gold {
    background: var(--gold);
    color: #17130A;
}

/* =========================
   STATUS
========================= */

.status {
    display: flex;
    justify-content: space-between;
    max-width: 850px;
    margin: 0 auto 20px;
    font-weight: bold;
    font-size: 15px;
}

.lives {
    color: var(--red);
}

.xp {
    color: var(--gold);
}

.streak {
    color: var(--orange);
}

/* =========================
   GAME AREA
========================= */

.game-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 35px;
    max-width: 1000px;
    margin: 30px auto;
}

.pythagoras-box {
    background: var(--panel);
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    min-width: 220px;
}

.pythagoras {
    font-size: 100px;
}

.pythagoras-name {
    color: var(--gold);
    font-weight: bold;
}

.question-area {
    background: var(--panel);
    padding: 30px;
    border-radius: 14px;
    text-align: center;
    max-width: 600px;
    width: 100%;
}

.question {
    white-space: pre-line;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.5;
    margin-bottom: 20px;
}

/* =========================
   INPUT
========================= */

.answer-input {
    width: 260px;
    padding: 13px;
    border: none;
    border-radius: 7px;
    font-size: 20px;
    text-align: center;
    margin: 10px;
}

/* =========================
   RESULT
========================= */

.result {
    text-align: center;
    max-width: 700px;
    margin: 80px auto;
}

.result-title {
    font-size: 40px;
    font-weight: bold;
}

.correct {
    color: var(--green);
}

.incorrect {
    color: var(--red);
}

.final-score {
    color: var(--gold);
    font-size: 24px;
    font-weight: bold;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    #game {
        padding: 15px;
    }

    .logo {
        font-size: 30px;
    }

    .game-area {
        flex-direction: column;
    }

    .status {
        font-size: 13px;
    }

    .question-area {
        width: 100%;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<script>

/* ============================================================
   PYTHAGORAS: THE TRIANGLE QUEST
   GitHub Edition
============================================================ */

let level = 1;
let xp = 0;
let score = 0;
let lives = 3;
let streak = 0;

let currentAnswer = "";
let questionType = "";


/* ============================================================
   BASIC FUNCTIONS
============================================================ */

const game = document.getElementById("game");

function clearScreen() {
    game.innerHTML = "";
}

function button(text, action, className = "") {
    return `
        <button class="game-button ${className}" onclick="${action}">
            ${text}
        </button>
    `;
}


/* ============================================================
   MUSIC
============================================================ */

let musicEnabled = true;
let audioContext = null;
let musicInterval = null;

function startMusic() {

    if (!musicEnabled) return;

    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (musicInterval) return;

    const notes = [261.63, 329.63, 392.00, 329.63];
    let i = 0;

    musicInterval = setInterval(() => {

        if (!musicEnabled) return;

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.frequency.value = notes[i % notes.length];
        oscillator.type = "sine";

        gain.gain.setValueAtTime(0.025, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.7
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.7);

        i++;

    }, 1000);
}

function stopMusic() {

    if (musicInterval) {
        clearInterval(musicInterval);
        musicInterval = null;
    }
}

function toggleMusic() {

    musicEnabled = !musicEnabled;

    if (musicEnabled) {
        startMusic();
    } else {
        stopMusic();
    }

    showStart();
}


/* ============================================================
   AVATARS
============================================================ */

function avatarRow() {

    const people = [
        ["👩🏻", "Hela"],
        ["👩🏼", "Frida"],
        ["👩🏻", "Ghalia"],
        ["👨🏻", "Karim"],
        ["△", "Pythagoras"]
    ];

    return `
        <div class="avatars">

            ${people.map(person => `
                <div class="avatar-card">
                    <div class="avatar">${person[0]}</div>
                    <div class="avatar-name">${person[1]}</div>
                </div>
            `).join("")}

        </div>
    `;
}


/* ============================================================
   PYTHAGORAS
============================================================ */

function pythagoras(mood = "happy") {

    let face = "😄";

    if (mood === "sad") face = "🤔";
    if (mood === "thinking") face = "🧐";

    return `
        <div class="pythagoras-box">

            <div class="pythagoras">
                🧔🏻‍♂️
            </div>

            <div style="font-size:35px; color:#FFD166;">
                ${face}
            </div>

            <div class="pythagoras-name">
                PYTHAGORAS
            </div>

            <div style="
                background:#FFF0B3;
                color:#5B4311;
                padding:8px;
                margin-top:12px;
                border-radius:5px;
                font-weight:bold;
            ">
                a² + b² = c²
            </div>

        </div>
    `;
}


/* ============================================================
   START SCREEN
============================================================ */

function showStart() {

    clearScreen();

    startMusic();

    game.innerHTML = `

        <div class="start-screen">

            <div class="logo">
                △ PYTHAGORAS △
            </div>

            <div class="subtitle">
                THE TRIANGLE QUEST
            </div>

            <div class="tagline">
                A mathematical adventure
            </div>

            ${avatarRow()}

            <div class="panel">

                <h2>
                    🏛️ Pythagoras needs your help!
                </h2>

                <p style="color:#AAB6D6;">
                    4 levels • XP • lives • streaks • challenges
                </p>

                ${button(
                    "🚀 START THE QUEST",
                    "startGame()",
                    "green"
                )}

                <br>

                ${button(
                    musicEnabled
                        ? "🔊 MUSIC: ON"
                        : "🔇 MUSIC: OFF",
                    "toggleMusic()",
                    ""
                )}

            </div>

        </div>
    `;
}


/* ============================================================
   START GAME
============================================================ */

function startGame() {

    level = 1;
    xp = 0;
    score = 0;
    lives = 3;
    streak = 0;

    showLevelIntro();
}


/* ============================================================
   LEVEL INTRO
============================================================ */

function showLevelIntro() {

    clearScreen();

    const levels = {

        1: [
            "LEVEL 1",
            "THE SECRET OF THE HYPOTENUSE",
            "Find the side opposite the right angle."
        ],

        2: [
            "LEVEL 2",
            "THE MISSING SIDE",
            "Use the theorem to calculate the length."
        ],

        3: [
            "LEVEL 3",
            "THE PYTHAGOREAN CHALLENGE",
            "This time, find a hidden side."
        ],

        4: [
            "LEVEL 4",
            "THE THEOREM MASTER",
            "Final challenge: complete the formula."
        ]

    };

    const data = levels[level];

    game.innerHTML = `

        <div class="header">
            <h2>${data[0]} • ${data[1]}</h2>
            <span>XP ${xp}</span>
        </div>

        <div class="game-area">

            ${pythagoras("happy")}

            <div class="question-area">

                <h2>
                    ${data[2]}
                </h2>

                <p style="color:#AAB6D6;">
                    Ready? Pythagoras is watching. 👀
                </p>

                ${button(
                    "⚡ ENTER LEVEL",
                    "generateQuestion()",
                    "purple"
                )}

                <div style="
                    background:#202B4A;
                    height:12px;
                    margin-top:25px;
                    border-radius:10px;
                    overflow:hidden;
                ">

                    <div style="
                        background:#39D9FF;
                        height:100%;
                        width:${level * 25}%;
                    "></div>

                </div>

            </div>

        </div>
    `;
}


/* ============================================================
   STATUS BAR
============================================================ */

function statusBar() {

    return `
        <div class="status">

            <div class="lives">
                ❤️ ${lives}
            </div>

            <div class="xp">
                ⭐ ${xp} XP
            </div>

            <div class="streak">
                🔥 STREAK ${streak}
            </div>

        </div>
    `;
}


/* ============================================================
   QUESTIONS
============================================================ */

function generateQuestion() {

    clearScreen();

    if (level === 1) {

        questionType = "hypotenuse";

        currentAnswer = "5 cm";

        createChoiceQuestion(
            `A right triangle has sides:

3 cm • 4 cm • 5 cm

Which side is the hypotenuse?`,
            ["3 cm", "4 cm", "5 cm"]
        );

    }

    else if (level === 2) {

        questionType = "number";

        const triangles = [
            [3, 4, 5],
            [5, 12, 13],
            [6, 8, 10],
            [8, 15, 17]
        ];

        const triangle =
            triangles[Math.floor(Math.random() * triangles.length)];

        const a = triangle[0];
        const b = triangle[1];
        const c = triangle[2];

        currentAnswer = c;

        createInputQuestion(
            `Two sides measure ${a} cm and ${b} cm.

What is the hypotenuse?`
        );

    }

    else if (level === 3) {

        questionType = "number";

        const triangles = [
            [5, 13, 12],
            [8, 17, 15],
            [7, 25, 24],
            [9, 15, 12]
        ];

        const triangle =
            triangles[Math.floor(Math.random() * triangles.length)];

        const a = triangle[0];
        const c = triangle[1];
        const b = triangle[2];

        currentAnswer = b;

        createInputQuestion(
            `Hypotenuse = ${c} cm
One side = ${a} cm

Find the missing side.`
        );

    }

    else {

        questionType = "formula";

        currentAnswer = "a2+b2=c2";

        createInputQuestion(
            `🏆 FINAL CHALLENGE

Complete the Pythagorean theorem:

_____ + _____ = _____`
        );
    }
}


/* ============================================================
   MULTIPLE CHOICE
============================================================ */

function createChoiceQuestion(question, options) {

    game.innerHTML = `

        <div class="header">
            <h2>LEVEL ${level}</h2>
            <span>Multiple choice</span>
        </div>

        ${statusBar()}

        <div class="game-area">

            ${pythagoras("happy")}

            <div class="question-area">

                <div class="question">
                    ${question}
                </div>

                ${options.map(option =>
                    button(
                        option,
                        `checkAnswer('${option}')`
                    )
                ).join("")}

            </div>

        </div>
    `;
}


/* ============================================================
   INPUT QUESTION
============================================================ */

function createInputQuestion(question) {

    game.innerHTML = `

        <div class="header">
            <h2>LEVEL ${level}</h2>
            <span>Calculation challenge</span>
        </div>

        ${statusBar()}

        <div class="game-area">

            ${pythagoras("thinking")}

            <div class="question-area">

                <div class="question">
                    ${question}
                </div>

                <input
                    id="answer"
                    class="answer-input"
                    type="text"
                    placeholder="Your answer"
                    autocomplete="off"
                >

                <br>

                ${button(
                    "✅ SUBMIT",
                    "submitAnswer()",
                    "green"
                )}

            </div>

        </div>
    `;

    setTimeout(() => {

        const input = document.getElementById("answer");

        if (input) {

            input.focus();

            input.addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    submitAnswer();
                }

            });
        }

    }, 50);
}


/* ============================================================
   ANSWERS
============================================================ */

function checkAnswer(answer) {

    if (answer === currentAnswer) {

        correct(100);

    } else {

        wrong();

    }
}


function submitAnswer() {

    const input = document.getElementById("answer");

    if (!input) return;

    let answer =
        input.value
        .trim()
        .toLowerCase()
        .replace(/\s/g, "");

    if (questionType === "formula") {

        const accepted = [
            "a2+b2=c2",
            "a²+b²=c²",
            "a2+b2=c²",
            "a²+b²=c2"
        ];

        if (accepted.includes(answer)) {

            correct(200);

        } else {

            wrong();

        }

    } else {

        const number =
            parseFloat(answer.replace(",", "."));

        if (
            !isNaN(number) &&
            Math.abs(number - Number(currentAnswer)) < 0.01
        ) {

            correct(150);

        } else {

            wrong();

        }
    }
}


/* ============================================================
   CORRECT / WRONG
============================================================ */

function correct(points) {

    streak++;

    const bonus =
        Math.max(0, (streak - 1) * 25);

    const gained =
        points + bonus;

    xp += gained;
    score += gained;

    showResult(true, gained);
}


function wrong() {

    lives--;
    streak = 0;

    if (lives <= 0) {

        showGameOver();

    } else {

        showResult(false, 0);

    }
}


/* ============================================================
   RESULT
============================================================ */

function showResult(isCorrect, gained) {

    clearScreen();

    if (isCorrect) {

        game.innerHTML = `

            <div class="result">

                ${pythagoras("happy")}

                <div class="result-title correct">
                    🎉 CORRECT!
                </div>

                <p style="font-size:20px;">
                    +${gained} XP
                </p>

                <p>
                    Pythagoras is impressed!
                </p>

                ${
                    level < 4

                    ? button(
                        "➡️ NEXT LEVEL",
                        "nextLevel()",
                        "green"
                    )

                    : button(
                        "🏆 SEE YOUR RESULT",
                        "showVictory()",
                        "gold"
                    )
                }

            </div>
        `;

    } else {

        game.innerHTML = `

            <div class="result">

                ${pythagoras("sad")}

                <div class="result-title incorrect">
                    🤔 NOT QUITE...
                </div>

                <p style="font-size:20px;">
                    You have ${lives} ❤️ left.
                </p>

                <p>
                    Remember:
                    <strong>a² + b² = c²</strong>
                </p>

                ${button(
                    "🔄 TRY AGAIN",
                    "generateQuestion()",
                    "purple"
                )}

            </div>
        `;
    }
}


/* ============================================================
   NEXT LEVEL
============================================================ */

function nextLevel() {

    level++;

    showLevelIntro();
}


/* ============================================================
   GAME OVER
============================================================ */

function showGameOver() {

    clearScreen();

    game.innerHTML = `

        <div class="result">

            ${pythagoras("sad")}

            <div class="result-title incorrect">
                💥 GAME OVER
            </div>

            <p style="font-size:20px;">
                Final score: ${score} XP
            </p>

            ${button(
                "🚀 PLAY AGAIN",
                "startGame()",
                "green"
            )}

        </div>
    `;
}


/* ============================================================
   VICTORY
============================================================ */

function showVictory() {

    clearScreen();

    game.innerHTML = `

        <div class="result">

            <div class="result-title" style="color:#FFD166;">
                🏆 THEOREM MASTER 🏆
            </div>

            ${avatarRow()}

            <h2 style="color:#35E08A;">
                MISSION ACCOMPLISHED!
            </h2>

            <p style="font-size:18px; line-height:1.7;">
                You defeated the triangles.<br>
                You found the missing sides.<br>
                You mastered the theorem!
            </p>

            <p style="
                font-size:25px;
                font-weight:bold;
                color:#FFD166;
            ">
                a² + b² = c²
            </p>

            <div class="final-score">
                FINAL SCORE: ${score} XP
            </div>

            ${button(
                "🎮 PLAY AGAIN",
                "startGame()",
                "green"
            )}

        </div>
    `;
}


/* ============================================================
   START
============================================================ */

showStart();

</script>

</body>
</html>
